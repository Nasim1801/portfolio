    <script>
      (() => {
        let stored;
        try {
          stored = localStorage.getItem('nm-theme');
        } catch {
          /* Storage unavailable */
        }
        const theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0d0b24' : '#eef4ff');
      })();
    </script>
