<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/bricolage-grotesque-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (() => {
        let stored;
        try {
          stored = localStorage.getItem('nm-theme');
        } catch {
          /* Storage unavailable */
        }
        const theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.js = '';
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#18211e' : '#f5f6f0');
      })();
    </script>
    <title>Nasim Mosayebi | Graduate Software Engineer</title>
    <!--page-metadata-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
